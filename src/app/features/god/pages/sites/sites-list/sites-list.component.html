<div class="list-card">
  <div class="header">
    <h2 class="title-lg">Liste</h2>
    <a mat-raised-button color="primary" routerLink="/god/sites/new">Ajouter</a>
  </div>
  <div class="toolbar">
    <mat-form-field appearance="fill" class="filter">
      <mat-label>Rechercher</mat-label>
      <input matInput [value]="query" (input)="applyFilter($any($event.target).value)" placeholder="Nom, ville, adresse..." />
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nom </th>
      <td mat-cell *matCellDef="let s"> {{ s.name }} </td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef> Adresse </th>
      <td mat-cell *matCellDef="let s"> {{ s.address }} {{ s.zipCode }} {{ s.city }} </td>
    </ng-container>

    <ng-container matColumnDef="city">
      <th mat-header-cell *matHeaderCellDef> Ville </th>
      <td mat-cell *matCellDef="let s"> {{ s.city }} </td>
    </ng-container>

    <ng-container matColumnDef="country">
      <th mat-header-cell *matHeaderCellDef> Pays </th>
      <td mat-cell *matCellDef="let s"> {{ s.country }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let s">
        <a mat-raised-button color="primary" [routerLink]="['/god/sites', s.id]">Détails</a>
        <button mat-raised-button color="warn" (click)="confirmDelete(s.id)">Supprimer</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
