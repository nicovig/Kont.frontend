<div class="wrap">
  <div class="content">
    <div class="card">
      <h2 class="title-lg">{{ isNew ? 'Créer un administrateur' : 'Modifier un administrateur' }}</h2>
      <form (submit)="$event.preventDefault()" novalidate>
        <div class="row2">
          <div>
            <label>Prénom *</label>
            <input [(ngModel)]="admin.firstname" name="firstname" required />
          </div>
          <div>
            <label>Nom *</label>
            <input [(ngModel)]="admin.lastname" name="lastname" required />
          </div>
        </div>
        <div class="row2">
          <div>
            <label>Email *</label>
            <input [(ngModel)]="admin.email" name="email" required />
          </div>
          <div>
            <label>Téléphone *</label>
            <input [(ngModel)]="admin.phoneNumber" name="phoneNumber" required />
          </div>
        </div>
        <div class="row">
          <label>Mot de passe *</label>
          <input type="password" [(ngModel)]="admin.password" name="password" required />
        </div>
        <button class="primary" (click)="onSave()" [disabled]="loading">{{ isNew ? 'Créer' : 'Modifier' }}</button>
        <div class="error" *ngIf="error">{{ error }}</div>
      </form>
    </div>
  </div>
</div>
