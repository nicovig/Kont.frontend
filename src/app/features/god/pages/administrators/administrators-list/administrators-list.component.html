<div class="list-card">
  <div class="header">
    <h2 class="title-lg">Liste</h2>
    <a mat-raised-button color="primary" routerLink="/god/administrators/new">Ajouter</a>
  </div>
  <div class="toolbar">
    <mat-form-field class="filter" appearance="fill">
      <mat-label>Rechercher</mat-label>
      <input matInput [value]="query" (input)="applyFilter($any($event.target).value)" placeholder="Nom, email..." />
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nom </th>
      <td mat-cell *matCellDef="let a"> {{ a.firstname }} {{ a.lastname }} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let a"> {{ a.email }} </td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef> Téléphone </th>
      <td mat-cell *matCellDef="let a"> {{ a.phoneNumber }} </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Rôle </th>
      <td mat-cell *matCellDef="let a"> {{ a.role?.roleType }} </td>
    </ng-container>

    <ng-container matColumnDef="sites">
      <th mat-header-cell *matHeaderCellDef> Sites </th>
      <td mat-cell *matCellDef="let a"> {{ getSitesLabel(a) }} </td>
    </ng-container>

    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef> Actif </th>
      <td mat-cell *matCellDef="let a"> {{ a.isActive ? 'Oui' : 'Non' }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let a">
        <a mat-raised-button color="primary" [routerLink]="['/god/administrators', a.id]">Détails</a>
        <button mat-raised-button color="warn" (click)="confirmDelete(a.id)">Supprimer</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
