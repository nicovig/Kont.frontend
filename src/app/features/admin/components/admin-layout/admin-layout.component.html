<div class="admin-layout">
  <mat-toolbar class="admin-toolbar">
    <div class="toolbar-content">
      <!-- Logo and Title -->
      <div class="toolbar-left">
        <mat-icon class="logo-icon">sports_esports</mat-icon>
        <span class="app-title">Kont Admin</span>
      </div>

      <!-- Site Selector -->
      <div class="toolbar-center">
        <app-site-selector></app-site-selector>
      </div>

      <!-- User Menu -->
      <div class="toolbar-right">
        <button 
          mat-icon-button 
          [matMenuTriggerFor]="userMenu"
          class="user-menu-button">
          <mat-icon>account_circle</mat-icon>
        </button>
        
        <mat-menu #userMenu="matMenu" class="user-menu">
          <div class="user-info">
            <div class="user-name">{{ getAdminDisplayName(currentAdmin$ | async) }}</div>
            <div class="user-email" *ngIf="currentAdmin$ | async as admin">{{ admin.email }}</div>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onLogout()">
            <mat-icon>logout</mat-icon>
            <span>Déconnexion</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </mat-toolbar>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
