<div class="activities-container">
  <!-- Liste des activités -->
  <div *ngIf="currentView === 'list'">
    <app-activities-list
      [activities]="(activities$ | async) || []"
      [loading]="(activitiesLoading$ | async) || false"
      [error]="activitiesError$ | async"
      (delete)="deleteActivity($event)"
      (open)="onActivityOpen($event)">
    </app-activities-list>
  </div>

  <!-- Formulaire de création -->
  <div *ngIf="currentView === 'create'">
    <app-activity-form
      [isEditMode]="false"
      (formSubmitted)="onFormSubmitted()"
      (formCancelled)="onFormCancelled()"
    ></app-activity-form>
  </div>

  <!-- Formulaire d'édition -->
  <div *ngIf="currentView === 'edit' && activityToEdit">
    <app-activity-form
      [activity]="activityToEdit"
      [isEditMode]="true"
      (formSubmitted)="onFormSubmitted()"
      (formCancelled)="onFormCancelled()"
    ></app-activity-form>
  </div>

  <!-- Détail de l'activité -->
  <div *ngIf="currentView === 'detail' && selectedActivity">
    <app-activity-detail
      [activityId]="selectedActivity.id"
      (editRequested)="onEditRequested($event)"
      (backToList)="backToList()"
    ></app-activity-detail>
  </div>
</div>
