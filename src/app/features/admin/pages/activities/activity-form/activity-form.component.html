<div class="activity-form-container">
  <div class="form-header">
    <h2>{{ isEditMode ? 'Modifier l\'activité' : 'Créer une nouvelle activité' }}</h2>
    <button type="button" class="btn btn-secondary" (click)="onCancel()">
      Annuler
    </button>
  </div>

  <form [formGroup]="activityForm" (ngSubmit)="onSubmit()" class="activity-form">
    <div class="form-group">
      <label for="name" class="form-label">
        Nom de l'activité <span class="required">*</span>
      </label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('name')"
        placeholder="Entrez le nom de l'activité"
      />
      <div class="invalid-feedback" *ngIf="isFieldInvalid('name')">
        {{ getFieldError('name') }}
      </div>
    </div>

    <div class="form-group">
      <label for="description" class="form-label">Description</label>
      <textarea
        id="description"
        formControlName="description"
        class="form-control"
        rows="4"
        placeholder="Décrivez l'activité (optionnel)"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="siteId" class="form-label">
        Site <span class="required">*</span>
      </label>
      <select
        id="siteId"
        formControlName="siteId"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('siteId')"
      >
        <option value="">Sélectionnez un site</option>
        <option 
          *ngFor="let site of sites$ | async" 
          [value]="site.id"
        >
          {{ site.name }}
        </option>
      </select>
      <div class="invalid-feedback" *ngIf="isFieldInvalid('siteId')">
        {{ getFieldError('siteId') }}
      </div>
      <div class="form-text" *ngIf="sitesLoading$ | async">
        Chargement des sites...
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Métriques de scoring</label>
      <div class="scoring-metrics-section">
        <p class="form-text">
          Les métriques de scoring peuvent être ajoutées après la création de l'activité.
        </p>
        <div class="metrics-placeholder">
          <span class="metrics-icon">📊</span>
          <span>Métriques à configurer</span>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="activityForm.invalid || (formLoading$ | async)"
      >
        <span *ngIf="formLoading$ | async" class="spinner"></span>
        {{ isEditMode ? 'Mettre à jour' : 'Créer l\'activité' }}
      </button>
      <button 
        type="button" 
        class="btn btn-secondary"
        (click)="onCancel()"
        [disabled]="formLoading$ | async"
      >
        Annuler
      </button>
    </div>

    <div class="form-error" *ngIf="formError$ | async as error">
      <div class="alert alert-danger">
        <strong>Erreur :</strong> {{ error }}
      </div>
    </div>
  </form>
</div>
