<div class="list-card">
  <div class="header">
    <h2 class="title-lg">Liste</h2>
    <button mat-raised-button color="primary" (click)="open.emit('new')">Ajouter</button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nom </th>
      <td mat-cell *matCellDef="let activity"> {{ activity.name }} </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let activity"> {{ activity.description || 'Aucune description' }} </td>
    </ng-container>

    <ng-container matColumnDef="site">
      <th mat-header-cell *matHeaderCellDef> Site </th>
      <td mat-cell *matCellDef="let activity"> {{ activity.site?.name || 'Non assigné' }} </td>
    </ng-container>

    <ng-container matColumnDef="metrics">
      <th mat-header-cell *matHeaderCellDef> Métriques </th>
      <td mat-cell *matCellDef="let activity"> {{ getScoringMetricsCount(activity) }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let activity">
        <button mat-raised-button color="primary" (click)="open.emit(activity.id)">Détails</button>
        <button mat-raised-button color="warn" (click)="confirmDelete(activity.id)">Supprimer</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
