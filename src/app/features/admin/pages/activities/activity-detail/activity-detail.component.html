<div class="wrap">
  <div class="content">
    <div class="card" *ngIf="selectedActivity$ | async as activity">
      <h2 class="title-lg">{{ activity.name }}</h2>
      
      <div class="detail-section">
        <h3>Description</h3>
        <p>{{ activity.description || 'Aucune description' }}</p>
      </div>

      <div class="detail-section">
        <h3>Site</h3>
        <p>{{ activity.site.name || 'Non assigné' }}</p>
      </div>

      <div class="detail-section">
        <h3>Métriques de scoring</h3>
        <p>{{ activity.scoringMetrics.length || 0 }} métrique(s) définie(s)</p>
      </div>

      <div class="detail-section">
        <h3>Date de création</h3>
        <p>{{ activity.createdAt | date:'short' }}</p>
      </div>

      <div class="actions">
        <button mat-raised-button color="primary" (click)="onEdit(activity)">Modifier</button>
        <button mat-button (click)="onBack()">Retour à la liste</button>
      </div>
    </div>
  </div>
</div>
