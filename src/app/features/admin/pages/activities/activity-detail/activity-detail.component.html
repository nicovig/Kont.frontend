<div class="p-6">
  <div class="mx-auto max-w-3xl">
    <div class="rounded-lg bg-white shadow p-6" *ngIf="selectedActivity$ | async as activity">
      <h2 class="text-2xl font-semibold mb-4">{{ activity.name }}</h2>

      <div class="space-y-4">
        <div>
          <h3 class="text-lg font-semibold">Description</h3>
          <p class="text-gray-700">{{ activity.description || 'Aucune description' }}</p>
        </div>

        <div>
          <h3 class="text-lg font-semibold">Site</h3>
          <p class="text-gray-700">{{ activity.site.name || 'Non assigné' }}</p>
        </div>

        <div>
          <h3 class="text-lg font-semibold">Métriques de scoring</h3>
          <p class="text-gray-700">{{ activity.scoringMetrics.length || 0 }} métrique(s) définie(s)</p>
        </div>

        <div>
          <h3 class="text-lg font-semibold">Date de création</h3>
          <p class="text-gray-700">{{ activity.createdAt | date:'short' }}</p>
        </div>
      </div>

      <div class="mt-6 flex gap-2">
        <button mat-raised-button color="primary" (click)="onEdit(activity)">Modifier</button>
        <button mat-button (click)="onBack()">Retour à la liste</button>
      </div>
    </div>
  </div>
</div>
