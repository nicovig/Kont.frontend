<div class="mt-6">
  <h3 class="text-lg font-semibold mb-2">Sessions</h3>
  <div class="flex items-end gap-4 mb-4 items-start">
    <mat-form-field appearance="fill" class="w-80">
      <mat-label>Activité</mat-label>
      <mat-select [(ngModel)]="newSessionActivityId">
        <mat-option *ngFor="let a of event?.activities" [value]="a.id">{{ a.name }}</mat-option>
      </mat-select>
    </mat-form-field>
    <button class="mt-2" mat-stroked-button color="primary" (click)="add.emit(newSessionActivityId)" [disabled]="!newSessionActivityId || !canEdit">Ajouter une session</button>
    <button class="mt-2" mat-raised-button color="primary" (click)="validateAllPresent.emit()" [disabled]="!canAddPlayers">Valider tous présents</button>
  </div>
  <div class="rounded-lg border">
    <table class="w-full text-sm">
      <thead>
        <tr class="text-left">
          <th class="p-3">Activité</th>
          <th class="p-3">Début</th>
          <th class="p-3">Fin</th>
          <th class="p-3">Statut</th>
          <th class="p-3">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of sessions" class="border-t">
          <td class="p-3">{{ s.activity.name }}</td>
          <td class="p-3">
            <input type="time" class="border rounded px-2 py-1" [ngModel]="timeFromDate(s.startedAt)" (ngModelChange)="startTimeChange.emit({ id: s.id, hhmm: $event })" [disabled]="!canEdit" />
          </td>
          <td class="p-3">
            <input type="time" class="border rounded px-2 py-1" [ngModel]="timeFromDate(s.endedAt)" (ngModelChange)="endTimeChange.emit({ id: s.id, hhmm: $event })" [disabled]="!canEdit" />
          </td>
          <td class="p-3">{{ s.status }}</td>
          <td class="p-3 flex gap-2">
            <button mat-button color="primary" (click)="changeStatus.emit({ id: s.id, status: GameSessionStatus.Active })" [disabled]="!canEdit">Démarrer</button>
            <button mat-button color="primary" (click)="changeStatus.emit({ id: s.id, status: GameSessionStatus.Completed })" [disabled]="!canEdit">Terminer</button>
            <button mat-button color="warn" (click)="remove.emit(s.id)" [disabled]="!canEdit">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
