<div class="p-6">
  <div>
    <div class="rounded-lg bg-white shadow p-6" *ngIf="event">
      <h2 class="text-2xl font-semibold mb-4">{{ event.name }}</h2>
      <div class="space-y-2 text-gray-700">
        <div>
          <span class="font-medium">Lien:</span> {{ event.eventLink }}
        </div>
        <div>
          <span class="font-medium">Site:</span> {{ event.site.name }}
        </div>
        <div>
          <span class="font-medium">Période:</span> {{ event.startedAt | date:'dd/MM/yyyy' }} → {{ event.endedAt | date:'dd/MM/yyyy' }}
        </div>
        <div>
          <span class="font-medium">Statut:</span>
          <span [class]="statusClass()"> {{ statusLabel() }}</span>
        </div>
        <div>
          <span class="font-medium">Activités:</span> {{ event.activities.length || 0 }}
        </div>
      </div>
      <div class="mt-6 flex gap-2">
        <button mat-raised-button color="primary" (click)="onEdit(event)" [disabled]="event.status !== EventStatus.Pending">Modifier</button>
        <button mat-button (click)="onBack()">Retour à la liste</button>
      </div>
    </div>
  </div>
</div>
