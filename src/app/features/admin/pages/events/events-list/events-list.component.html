<div class="rounded-lg bg-white shadow p-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-semibold">Événements</h2>
    <button mat-raised-button color="primary" (click)="create.emit()">Ajouter</button>
  </div>

  <div class="flex items-end gap-4 mb-4">
    <mat-form-field appearance="fill" class="flex-1">
      <mat-label>Filtrer par nom</mat-label>
      <input matInput [(ngModel)]="filterText" (ngModelChange)="applyFilters()" placeholder="Rechercher..." />
    </mat-form-field>
    <mat-form-field appearance="fill" class="w-56">
      <mat-label>Statut</mat-label>
      <mat-select [(ngModel)]="filterStatus" (ngModelChange)="applyFilters()">
        <mat-option value="">Tous</mat-option>
        <mat-option [value]="EventStatus.Pending">Prévu</mat-option>
        <mat-option [value]="EventStatus.Active">En cours</mat-option>
        <mat-option [value]="EventStatus.Completed">Terminé</mat-option>
        <mat-option [value]="EventStatus.Cancelled">Annulé</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="fill" class="w-56">
      <mat-label>De</mat-label>
      <input matInput [matDatepicker]="dpFrom" [(ngModel)]="filterDateFrom" (ngModelChange)="applyFilters()" placeholder="JJ/MM/AAAA" />
      <mat-datepicker-toggle matIconSuffix [for]="dpFrom"></mat-datepicker-toggle>
      <mat-datepicker #dpFrom></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="fill" class="w-56">
      <mat-label>À</mat-label>
      <input matInput [matDatepicker]="dpTo" [(ngModel)]="filterDateTo" (ngModelChange)="applyFilters()" placeholder="JJ/MM/AAAA" />
      <mat-datepicker-toggle matIconSuffix [for]="dpTo"></mat-datepicker-toggle>
      <mat-datepicker #dpTo></mat-datepicker>
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 w-full">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nom </th>
      <td mat-cell *matCellDef="let e"> {{ e.name }} </td>
    </ng-container>

    <ng-container matColumnDef="site">
      <th mat-header-cell *matHeaderCellDef> Site </th>
      <td mat-cell *matCellDef="let e"> {{ e.site?.name || 'Non assigné' }} </td>
    </ng-container>

    <ng-container matColumnDef="dates">
      <th mat-header-cell *matHeaderCellDef> Dates </th>
      <td mat-cell *matCellDef="let e"> {{ e.startedAt | date:'dd/MM/yyyy' }} → {{ e.endedAt | date:'dd/MM/yyyy' }} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Statut </th>
      <td mat-cell *matCellDef="let e"> <span [class]="statusClass(e)">{{ statusLabel(e) }}</span> </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let e">
        <button mat-raised-button color="primary" (click)="select.emit(e)">Détails</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
