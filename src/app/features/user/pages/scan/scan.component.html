<div class="min-h-screen bg-gradient-to-br from-blue-600 to-purple-700 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-10 h-10 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Kont</h1>
      <p class="text-gray-600">Scannez le QR code pour rejoindre l'événement</p>
    </div>

    <div class="space-y-6">
      <div class="text-center">
        <div class="w-48 h-48 bg-gray-100 rounded-lg mx-auto mb-4 flex items-center justify-center">
          <div class="text-center">
            <svg class="w-16 h-16 text-gray-400 mx-auto mb-2" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/>
            </svg>
            <p class="text-sm text-gray-500">Zone de scan QR</p>
          </div>
        </div>
        <button (click)="simulateScan()" 
                class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors">
          Scanner QR Code
        </button>
      </div>

      <div class="text-center">
        <p class="text-sm text-gray-500 mb-3">Ou saisissez manuellement :</p>
        <div class="flex space-x-2">
          <input type="text" 
                 placeholder="Code de l'événement"
                 [ngModel]="eventCode()"
                 (ngModelChange)="eventCode.set($event)"
                 class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button (click)="joinWithCode()" 
                  [disabled]="!eventCode()"
                  class="bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed">
            Rejoindre
          </button>
        </div>
      </div>

      <div class="text-center">
        <p class="text-xs text-gray-500">
          Vous avez déjà un compte ? 
          <button (click)="showReconnectModal()" class="text-blue-600 hover:text-blue-800 font-medium">
            Se reconnecter
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
